name: Rain CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, android, windows]
      build_profile:
        description: Build profile
        type: choice
        default: demo
        options: [demo, production]

permissions:
  contents: write

concurrency:
  group: rain-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run melos run analyze
      - run: dart run melos run test
      - run: ./scripts/check_obsidian_vault.ps1
        shell: pwsh

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Windows (demo)
        shell: pwsh
        run: |
          $defines = Join-Path $env:RUNNER_TEMP 'defines.json'
          Copy-Item apps/rain/tool/dart_defines.example.json $defines -Force
          ./scripts/build_release.ps1 -Platform windows -OutputDir artifacts -DartDefinesFile $defines -AllowPublicTurnForDemo -Clean
      - uses: actions/upload-artifact@v4
        with:
          name: Rain-Windows-x64
          path: artifacts/Rain-Demo-Windows-x64-Build
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android
    runs-on: windows-2022
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Android (demo)
        shell: pwsh
        run: |
          $defines = Join-Path $env:RUNNER_TEMP 'defines.json'
          Copy-Item apps/rain/tool/dart_defines.example.json $defines -Force
          ./scripts/build_release.ps1 -Platform android -OutputDir artifacts -DartDefinesFile $defines -AndroidArtifactSet mobile -AllowPublicTurnForDemo -UseDemoAndroidSigningKey -Clean
      - uses: actions/upload-artifact@v4
        with:
          name: Rain-Android-Builds
          path: |
            artifacts/Rain-Demo-Android-ARM-v7a-Build.apk
            artifacts/Rain-Demo-Android-ARM-v8-v9-Build.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="rain-ci-${{ github.run_number }}"
          gh release create "$tag" release-assets/**/* --generate-notes --prerelease || echo "release exists"
