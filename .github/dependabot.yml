version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor:
        update-types:
          - minor
          - patch
      github-actions-major:
        update-types:
          - major
  - package-ecosystem: npm
    directory: /backend/firebase/functions
    schedule:
      interval: weekly
    groups:
      firebase-functions-deps:
        patterns:
          - "*"
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    # Majors arrive as one PR per package so each migration lands alone.
    groups:
      pub-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # build 5 / analyzer >=13 conflict with freezed 3; move with the freezed 4 migration.
      - dependency-name: build_runner
        versions: [">=2.17.0"]
      - dependency-name: drift_dev
        versions: [">=2.35.0"]
